services:
  typhoon-asr:
    build: .
    image: typhoon-asr:local
    container_name: typhoon-asr
    restart: unless-stopped
    environment:
      # Required. Without it the middleware lets every request through, and this endpoint is CPU
      # that anyone on the internet could spend. Generate with: openssl rand -hex 32
      ASR_API_KEY: ${ASR_API_KEY:?set ASR_API_KEY in .env}
      # Matches the KVM 2 plan. Measured 9.13x realtime at two threads — the model is small enough
      # that more threads buy almost nothing.
      ASR_THREADS: "2"
    ports:
      # Loopback only. The public route is Caddy on this same box, which already terminates TLS for
      # meet./workjobs.prima49.com and can reach this container over the shared `edge` network —
      # publishing 8000 on 0.0.0.0 would put the API key on the wire in clear text instead.
      # Kept mapped so the service can still be exercised directly over SSH.
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - edge
    volumes:
      # Survives image rebuilds so the checkpoint is not re-downloaded each time.
      - hf-cache:/opt/hf
    # The target box is not idle: it also runs Rocket.Chat, MongoDB, Caddy on 80/443 and a Jitsi
    # stack, all on two cores. Transcription is batch work with nobody waiting on it, while a video
    # call or a chat message is someone waiting right now — so this container is capped below the
    # box and given the lowest CPU share, and loses every contest for the processor. Measured
    # throughput was 9.13x realtime on two free cores; at 1.5 it stays far ahead of the ~1.2x the
    # daily volume actually needs.
    cpus: 1.5
    cpu_shares: 256
    # 2g was not enough: NeMo decodes a whole recording in one pass, and a 201-second call drove
    # anon-rss to 2,089,828kB — the cgroup limit exactly — so the kernel killed uvicorn mid-request.
    # The proper fix is to chunk long audio before handing it to the model, which also matches how
    # this model was trained (its config caps training segments at 30s). Until that lands, the
    # ceiling has to clear the whole-file peak.
    mem_limit: 3500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hf-cache:

networks:
  # Created and owned by the workspec stack, which is where Caddy lives. Declared external so this
  # compose file joins it rather than trying to manage it — a `docker compose down` here must not
  # be able to take the network out from under Rocket.Chat and Jitsi.
  edge:
    external: true
