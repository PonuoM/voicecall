<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneCall to Google Drive Sync Dashboard</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* Calendar Panel */
        .calendar-panel { flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; }
        .calendar-header button { background: none; border: none; font-size: 16px; cursor: pointer; color: #007bff; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .calendar-day-header { font-size: 12px; font-weight: bold; color: #666; margin-bottom: 5px; }
        .calendar-day { padding: 10px 5px; border-radius: 4px; border: 1px solid #eee; font-size: 12px; cursor: pointer; transition: 0.2s; min-height: 50px; display: flex; flex-direction: column; justify-content: center; }
        .calendar-day:hover { border-color: #007bff; }
        .calendar-day.empty { background-color: #f8f9fa; color: #ccc; cursor: default; }
        .calendar-day.empty:hover { border-color: #eee; }
        .calendar-day.has-data { background-color: #e6f4ea; border-color: #cce8d6; color: #137333; }
        .calendar-day.no-data { background-color: #fff; color: #666; }
        .file-count-badge { font-size: 10px; font-weight: bold; margin-top: 4px; background: rgba(0,0,0,0.05); border-radius: 10px; padding: 2px 5px; display: inline-block; }
        
        /* Main Panel */
        .main-panel { flex: 2; min-width: 500px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .controls { display: flex; gap: 10px; align-items: center; }
        .controls input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .stats { display: flex; gap: 20px; margin-top: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .stat-card h3 { margin: 0; color: #666; font-size: 14px; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 32px; font-weight: bold; color: #333; }
        
        .btn-shortcut { background-color: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-shortcut:hover { background-color: #5a6268; }
        .btn-sync { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-sync:hover { background-color: #0056b3; }
        .btn-sync:disabled { background-color: #ccc; cursor: not-allowed; }
        .progress-container { width: 100%; background-color: #e9ecef; border-radius: 4px; overflow: hidden; margin-top: 20px; display: none; }
        .progress-bar { width: 0%; height: 20px; background-color: #28a745; transition: width 0.3s; text-align: center; color: white; font-size: 12px; line-height: 20px; }
        table { width: 100%; background: white; margin-top: 20px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #fafafa; font-weight: 600; color: #555; }
        .status-synced { color: #28a745; font-weight: bold; }
        .status-failed { color: #dc3545; font-weight: bold; }
        .status-skipped { color: #856404; font-weight: bold; }
        #logTableBody { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Calendar Heatmap Panel -->
        <div class="calendar-panel">
            <h2 style="margin-top:0; font-size:18px;">Calendar Heatmap</h2>
            <p style="font-size:12px; color:#666; margin-bottom: 20px;">คลิกวันที่เพื่อเลือกดึงข้อมูล</p>
            
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">◀ Prev</button>
                <span id="calendarMonthLabel">July 2026</span>
                <button onclick="changeMonth(1)">Next ▶</button>
            </div>
            
            <div class="calendar-grid">
                <div class="calendar-day-header">Sun</div>
                <div class="calendar-day-header">Mon</div>
                <div class="calendar-day-header">Tue</div>
                <div class="calendar-day-header">Wed</div>
                <div class="calendar-day-header">Thu</div>
                <div class="calendar-day-header">Fri</div>
                <div class="calendar-day-header">Sat</div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- Days will be generated here by JS -->
            </div>
        </div>

        <!-- Main Sync Panel -->
        <div class="main-panel">
            <div class="header">
                <div>
                    <h2 style="margin-top:0; margin-bottom:5px;">Audio Sync Dashboard</h2>
                    <p id="companyInfo" style="font-size:14px; color:#1a73e8; margin-top:0; font-weight:bold;"></p>
                    <div style="margin-top: 10px; display: flex; gap: 10px;">
                        <button class="btn-shortcut" onclick="setDateShortcut('today')">Today</button>
                        <button class="btn-shortcut" onclick="setDateShortcut('yesterday')">Yesterday</button>
                        <button class="btn-shortcut" onclick="setDateShortcut('last7days')">Last 7 Days</button>
                    </div>
                </div>
                <div class="controls">
                    <label>Start:</label>
                    <input type="datetime-local" id="startDate" value="2026-06-30T00:00">
                    <label>End:</label>
                    <input type="datetime-local" id="endDate" value="2026-06-30T23:59">
                    <button class="btn-sync" id="btnSync" onclick="startSync()">▶ Start Sync</button>
                </div>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <h3>Total Found</h3>
                    <p id="statTotal">0</p>
                </div>
                <div class="stat-card">
                    <h3>Successfully Synced</h3>
                    <p id="statSuccess" style="color: #28a745;">0</p>
                </div>
                <div class="stat-card">
                    <h3>Failed</h3>
                    <p id="statFailed" style="color: #dc3545;">0</p>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Call ID</th>
                        <th>Google Drive ID</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <!-- Logs will appear here -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // === Calendar Logic ===
        let currentCalDate = new Date(); // Start with current month
        let calendarStats = {};

        async function fetchCalendarStats() {
            try {
                const res = await fetch(`../api/sync/get_calendar_stats.php?company_id=${currentCompanyId}`);
                const data = await res.json();
                if (data.success) {
                    calendarStats = data.data;
                    renderCalendar();
                }
            } catch (err) {
                console.error("Failed to load calendar stats", err);
            }
        }

        function changeMonth(offset) {
            currentCalDate.setMonth(currentCalDate.getMonth() + offset);
            renderCalendar();
        }

        function selectCalendarDate(dateStr) {
            // dateStr format: YYYY-MM-DD
            document.getElementById('startDate').value = `${dateStr}T00:00`;
            document.getElementById('endDate').value = `${dateStr}T23:59`;
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendarMonthLabel').innerText = `${monthNames[month]} ${year}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Empty slots before 1st day
            for (let i = 0; i < firstDay; i++) {
                const div = document.createElement('div');
                div.className = 'calendar-day empty';
                grid.appendChild(div);
            }
            
            // Days
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const count = calendarStats[dateStr] || 0;
                
                const div = document.createElement('div');
                div.className = `calendar-day ${count > 0 ? 'has-data' : 'no-data'}`;
                div.onclick = () => selectCalendarDate(dateStr);
                
                let content = `<span>${i}</span>`;
                if (count > 0) {
                    content += `<span class="file-count-badge">${count} files</span>`;
                }
                
                div.innerHTML = content;
                grid.appendChild(div);
            }
        }

        // Initialize Calendar (moved below session init)
        // === Sync Logic ===
        let currentCompanyId = null;
        let currentFolderId = null;
        
        // Init session
        const sessionData = sessionStorage.getItem('voicecall_user') || localStorage.getItem('voicecall_user_shared');
        if (sessionData) {
            try {
                const user = JSON.parse(sessionData);
                currentCompanyId = user.company_id;
                document.getElementById('companyInfo').innerText = user.company_name ? `บริษัท: ${user.company_name}` : `Company ID: ${currentCompanyId}`;
                // Now that company ID is known, fetch stats
                fetchCalendarStats();
            } catch (e) {}
        }
        
        if (!currentCompanyId) {
            alert("กรุณาเข้าสู่ระบบผ่านหน้าหลัก (index.html) ก่อนใช้งาน Dashboard นี้นะครับ");
            // window.location.href = '../index.html'; // Optional redirect
        }

        let pendingFiles = [];
        let totalFiles = 0;
        let successCount = 0;
        let failCount = 0;
        let currentIndex = 0;
        let isSyncing = false;

        function formatDateTimeForAPI(datetimeLocal) {
            return datetimeLocal.replace('T', '_').replace(/[:-]/g, '') + '00';
        }

        function setDateShortcut(range) {
            const now = new Date();
            let start = new Date();
            let end = new Date();

            if (range === 'today') {
                start.setHours(0, 0, 0, 0);
                end.setHours(23, 59, 59, 999);
            } else if (range === 'yesterday') {
                start.setDate(start.getDate() - 1);
                start.setHours(0, 0, 0, 0);
                end.setDate(end.getDate() - 1);
                end.setHours(23, 59, 59, 999);
            } else if (range === 'last7days') {
                start.setDate(start.getDate() - 7);
                start.setHours(0, 0, 0, 0);
                end.setHours(23, 59, 59, 999);
            }
            
            const formatInput = (date) => {
                const tzOffset = (date.getTimezoneOffset() * 60000);
                return (new Date(date - tzOffset)).toISOString().slice(0, 16);
            };

            document.getElementById('startDate').value = formatInput(start);
            document.getElementById('endDate').value = formatInput(end);
        }

        async function startSync() {
            if (isSyncing) return;
            
            const startVal = document.getElementById('startDate').value;
            const endVal = document.getElementById('endDate').value;
            if (!startVal || !endVal) {
                alert("Please select Start and End date");
                return;
            }

            const formattedStart = formatDateTimeForAPI(startVal);
            const formattedEnd = formatDateTimeForAPI(endVal);

            if (!currentCompanyId) {
                alert("กรุณาเข้าสู่ระบบก่อนครับ");
                return;
            }

            isSyncing = true;
            document.getElementById('btnSync').disabled = true;
            document.getElementById('btnSync').innerText = "Loading List...";
            document.getElementById('logTableBody').innerHTML = "";
            document.getElementById('progressContainer').style.display = 'block';

            successCount = 0;
            failCount = 0;
            currentIndex = 0;
            updateStats();

            try {
                // 0. Resolve Folder ID (only once per session/company)
                if (!currentFolderId) {
                    document.getElementById('btnSync').innerText = "Finding Folder...";
                    const folderRes = await fetch(`../api/sync/get_folder_id.php?company_id=${currentCompanyId}`);
                    const folderData = await folderRes.json();
                    
                    if (!folderData.success) {
                        throw new Error("Folder lookup failed: " + (folderData.message || "Unknown error"));
                    }
                    currentFolderId = folderData.folder_id;
                }

                // 1. Get Pending List
                document.getElementById('btnSync').innerText = "Loading List...";
                const res = await fetch(`../api/sync/get_pending_list.php?company_id=${currentCompanyId}&start_date=${formattedStart}&end_date=${formattedEnd}`);
                const data = await res.json();
                
                if (!data.success) {
                    throw new Error(data.message || "Failed to fetch list");
                }

                pendingFiles = data.data;
                totalFiles = pendingFiles.length;
                document.getElementById('statTotal').innerText = totalFiles;
                
                if (totalFiles === 0) {
                    alert("All files in this date range are already synced!");
                    resetUI();
                    return;
                }

                const userConfirmed = confirm(`พบไฟล์เสียงที่รอการโอนย้ายจำนวน ${totalFiles} ไฟล์\n\nคุณต้องการเริ่มต้นการโอนย้ายไฟล์ลง Google Drive เลยหรือไม่?`);
                if (!userConfirmed) {
                    resetUI();
                    return;
                }

                document.getElementById('btnSync').innerText = "Syncing...";
                // 2. Start Processing Queue
                processBatch();

            } catch (err) {
                alert("Error: " + err.message);
                resetUI();
            }
        }

        async function processBatch() {
            if (currentIndex >= totalFiles) {
                alert("Sync Complete!");
                fetchCalendarStats(); // Refresh calendar counts!
                resetUI();
                return;
            }

            const batchSize = 10;
            const batch = [];
            for (let i = 0; i < batchSize && currentIndex < totalFiles; i++) {
                batch.push(pendingFiles[currentIndex]);
                currentIndex++;
            }

            const promises = batch.map(async (file) => {
                try {
                    const formData = new FormData();
                    formData.append('id', file.id);
                    formData.append('start', file.start);
                    formData.append('caller', file.caller);
                    formData.append('receiver', file.receiver);
                    formData.append('direction', file.direction);
                    formData.append('company_id', currentCompanyId);
                    formData.append('folder_id', currentFolderId);

                    const res = await fetch('../api/sync/process_single.php', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();

                    if (data.success) {
                        successCount++;
                        const statusClass = data.skipped ? 'status-skipped' : 'status-synced';
                        const statusText = data.skipped ? 'Skipped' : 'Synced';
                        appendLog(file.id, data.driveFileId || '-', statusText, statusClass);
                    } else {
                        failCount++;
                        appendLog(file.id, '-', `Failed: ${data.message}`, 'status-failed');
                    }
                } catch (err) {
                    failCount++;
                    appendLog(file.id, '-', `Error: ${err.message}`, 'status-failed');
                }
                updateProgressBar(); // Update per file completion
            });

            await Promise.all(promises);
            updateStats();
            
            setTimeout(processBatch, 100); 
        }

        function updateProgressBar() {
            const percentage = Math.round((currentIndex / totalFiles) * 100);
            const bar = document.getElementById('progressBar');
            bar.style.width = percentage + '%';
            bar.innerText = `${currentIndex} / ${totalFiles} (${percentage}%)`;
        }

        function updateStats() {
            document.getElementById('statSuccess').innerText = successCount;
            document.getElementById('statFailed').innerText = failCount;
        }

        function appendLog(id, driveId, statusText, statusClass) {
            const tbody = document.getElementById('logTableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${id}</td>
                <td>${driveId}</td>
                <td class="${statusClass}">${statusText}</td>
            `;
            tbody.insertBefore(tr, tbody.firstChild);
        }

        function resetUI() {
            isSyncing = false;
            document.getElementById('btnSync').disabled = false;
            document.getElementById('btnSync').innerText = "▶ Start Sync";
            if (totalFiles > 0) {
                currentIndex = totalFiles;
                updateProgressBar(); // 100%
            }
        }
    </script>
</body>
</html>
